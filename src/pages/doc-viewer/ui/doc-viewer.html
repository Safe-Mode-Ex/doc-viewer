@if (documentLoader.isLoading()) {
<div class="status">Загрузка документа...</div>
} @else if (documentLoader.error()) {
<div class="status status--error">Ошибка: Документ не найден.</div>
} @else {
<div class="viewer">
  <app-toolbar
    [documentName]="facade.documentName()"
    [zoom]="facade.zoom()"
    (zoomIn)="facade.zoomIn()"
    (zoomOut)="facade.zoomOut()"
    (save)="facade.saveAndExport()"
  >
  </app-toolbar>

  <main class="viewer__viewport" role="document" aria-label="Просмотрщик документа">
    <div class="viewer__document document">
      <div class="document__container" [style.width.%]="facade.zoom()">
        @for (page of pages(); track page.imageUrl) {
        <section class="document__page page" [attr.aria-label]="page.label">
          <img [src]="page.imageUrl" [attr.alt]="page.imageAlt" class="page__image" />
          <div
            class="page__annotations"
            (click)="promptNewAnnotation(page.number, $event)"
            (keydown)="promptNewAnnotationByKey(page.number, $event)"
            role="region"
            tabindex="0"
            [attr.aria-label]="page.annotationsLabel"
          >
            @for (annotation of facade.annotations(); track annotation.id) { @if
            (annotation.pageNumber === page.number) {
            <div
              appDraggable
              (dragEnd)="facade.updateAnnotationPosition(annotation.id, $event.xPercent, $event.yPercent)"
              [style.left.%]="annotation.x"
              [style.top.%]="annotation.y"
              class="draggable"
            >
              <app-text-annotation
                [content]="annotation.content"
                (delete)="facade.deleteAnnotation(annotation.id)"
                (updateContent)="facade.updateAnnotationContent(annotation.id, $event)"
              ></app-text-annotation>
            </div>
            } }
          </div>
        </section>
        }
      </div>
    </div>
  </main>
</div>
}
