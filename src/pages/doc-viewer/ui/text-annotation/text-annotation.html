<div
  class="annotation"
  [class.is-editing-mode]="isEditing()"
  role="note"
  aria-label="Текстовая аннотация"
  tabindex="0"
  (click)="onTap($event)"
  (keydown.enter)="startEdit($event)"
>
  @if (isEditing()) {
  <input
    #editInput
    type="text"
    [(ngModel)]="editableText"
    (blur)="saveEdit()"
    (keydown)="onKeyDown($event)"
    (mousedown)="$event.stopPropagation()"
    class="annotation__input"
    aria-label="Редактирование текста аннотации"
  />
  } @else {
  <div class="annotation__content" title="Двойное касание или двойной клик для редактирования">
    {{ content() }}
  </div>
  }

  <button class="btn btn--delete" (click)="onDeleteClick($event)" aria-label="Удалить аннотацию">
    <svg
      viewBox="0 0 24 24"
      width="14"
      height="14"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      aria-hidden="true"
    >
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
</div>
